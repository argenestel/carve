<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Carve — Exclusive licensing on Midnight</title>
    <meta name="description" content="Sell exclusive rights by region, category and time. Every grant is proven not to overlap, and the book stays private. On Midnight." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <body>
    <div id="root">
      <!-- Shown while the Midnight runtime (wasm, ~5 MB) downloads; React replaces it. -->

        <div style="font: 900 44px/1 'Big Shoulders Display', Impact, sans-serif; text-transform: uppercase">Carve</div>
        <div style="font-size: 14px; color: #5b6576">Loading the Midnight runtime…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
